customCommands:
  - key: "P"
    context: "worktrees"
    description: "Preview worktree on configured port"
    command: "worktree-preview use {{.SelectedWorktree.Branch | quote}}"
    loadingText: "Switching worktree preview"
    output: "terminal"
  - key: "X"
    context: "global"
    description: "Stop worktree preview"
    command: "worktree-preview stop"
    loadingText: "Stopping worktree preview"
    output: "terminal"
